output: dist/
releases:
  - name: production
    jobs:
      - name: linux-deb
        package:
          platform: linux
          target: deb
          build_args:
            dart-define:
              API_BASE_URL: https://api.boltmesh.net/v1
              WEBSITE_URL: https://boltmesh.net
          hooks:
            pre: bash boltmeshd/packaging/stage.sh
      - name: linux-rpm
        package:
          platform: linux
          target: rpm
          build_args:
            dart-define:
              API_BASE_URL: https://api.boltmesh.net/v1
              WEBSITE_URL: https://boltmesh.net
          hooks:
            pre: bash boltmeshd/packaging/stage.sh
      # `fastforge release --name=production` runs the jobs supported by the
      # host OS and skips the rest, so the same release name works on both the
      # Linux and Windows CI runners. Config: windows/packaging/exe/.
      #
      # The hook stages the boltmeshd helper (and the vendored Wintun driver)
      # into the bundle before Inno packs it. The installer is not Authenticode
      # signed.
      - name: windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            dart-define:
              API_BASE_URL: https://api.boltmesh.net/v1
              WEBSITE_URL: https://boltmesh.net
          hooks:
            pre: 'powershell -NoProfile -ExecutionPolicy Bypass -File windows/packaging/stage_boltmeshd.ps1 -BuildDir "$BUILD_OUTPUT_DIRECTORY"'
