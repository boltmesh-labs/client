display_name: BoltMesh
package_name: boltmesh
maintainer:
  name: BoltMesh Team
  email: support@boltmesh.example
priority: optional
section: net
# Installed size in kilobytes (Debian control `Installed-Size`, advisory).
# Flutter Linux release bundles run ~20-30 MB; calibrate via
# `du -sk build/linux/x64/release/bundle` after a successful build.
installed_size: 25000
dependencies:
  - libgtk-3-0
  # desktop_webview_window links WebKitGTK 4.1 and libsoup 3.
  - libwebkit2gtk-4.1-0
  - libsoup-3.0-0
  # flutter_secure_storage_linux links libsecret.
  - libsecret-1-0
  # boltmeshd enrollment uses account-management tools and loginctl.
  - passwd
  - systemd
  - wireguard-tools
icon: linux/assets/boltmesh.png
generic_name: VPN Client
keywords:
  - VPN
  - WireGuard
categories:
  - Network
  - Utility
startup_notify: true
# boltmeshd is staged inside the bundle at /opt/boltmesh/boltmeshd/ by
# `boltmeshd/packaging/stage.sh` (a pre-package hook). These scripts
# move it into place, create the socket group, and enable the socket. The
# staged files live under /opt and are owned by dpkg; the installed copies
# below are not, so postrm removes them explicitly.
postinstall_scripts:
  - install -Dm755 /opt/boltmesh/boltmeshd/boltmeshd /usr/libexec/boltmesh/boltmeshd
  - install -Dm644 /opt/boltmesh/boltmeshd/boltmeshd.service /usr/lib/systemd/system/boltmeshd.service
  - install -Dm644 /opt/boltmesh/boltmeshd/boltmeshd.socket /usr/lib/systemd/system/boltmeshd.socket
  - install -Dm755 /opt/boltmesh/boltmeshd/boltmesh-enroll-user /usr/libexec/boltmesh/boltmesh-enroll-user
  - install -Dm644 /opt/boltmesh/boltmeshd/99-boltmesh-unmanaged.conf /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
  # Create the group and enroll the unique active desktop user when the
  # helper validates SUDO_UID/PKEXEC_UID or loginctl identifies one.  If no
  # unambiguous user exists, the command prints an actionable warning and the
  # package remains usable in a headless install; an administrator can run
  # the installed command explicitly.
  - |
    if /usr/libexec/boltmesh/boltmesh-enroll-user --auto; then
      :
    else
      status="$?"
      printf 'boltmesh: desktop-user enrollment failed; run /usr/libexec/boltmesh/boltmesh-enroll-user --uid UID as root\n' >&2
      exit "$status"
    fi
  - systemctl daemon-reload >/dev/null 2>&1 || true
  - systemctl enable --now boltmeshd.socket >/dev/null 2>&1 || true
  - nmcli general reload conf >/dev/null 2>&1 || true
postuninstall_scripts:
  # Reload the new unit definitions, then stop and verify the daemon before
  # the socket. Its signal handler and ExecStopPost both call Manager.Down; the
  # explicit --cleanup is a final retry while the service-owned runtime
  # directory (and wg-quick config) still exists. Keep the destructive removals
  # in this set -e block so a failed teardown leaves the helper installed and
  # retryable.
  - |
    set -e
    if command -v systemctl >/dev/null 2>&1; then
      systemctl daemon-reload >/dev/null 2>&1
      systemctl disable boltmeshd.service boltmeshd.socket >/dev/null 2>&1 || true
    fi
    stop_unit() {
      unit="$1"
      if ! command -v systemctl >/dev/null 2>&1; then
        return 0
      fi
      load_state="$(systemctl show --property=LoadState --value "$unit")" || return 1
      if [ "$load_state" = "not-found" ]; then
        return 0
      fi
      if ! systemctl stop "$unit" >/dev/null 2>&1; then
        active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
        main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
        if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
          return 1
        fi
        [ "$main_pid" = 0 ] || return 1
        return 0
      fi
      active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
      main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
      if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
        return 1
      fi
      [ "$main_pid" = 0 ] || return 1
    }
    stop_unit boltmeshd.service
    stop_unit boltmeshd.socket
    /usr/libexec/boltmesh/boltmeshd --cleanup --config-dir=/run/boltmesh --interface=boltmesh0
    rm -f /run/boltmesh/boltmeshd.sock /run/boltmesh/boltmesh0.conf
    rmdir /run/boltmesh >/dev/null 2>&1 || true
    rm -f /usr/lib/systemd/system/boltmeshd.service /usr/lib/systemd/system/boltmeshd.socket
    rm -f /usr/libexec/boltmesh/boltmeshd
    rm -f /usr/libexec/boltmesh/boltmesh-enroll-user
    rm -f /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
    rmdir /usr/libexec/boltmesh >/dev/null 2>&1 || true
    systemctl daemon-reload >/dev/null 2>&1 || true
    nmcli general reload conf >/dev/null 2>&1 || true
