display_name: BoltMesh
icon: linux/assets/boltmesh.png
summary: BoltMesh WireGuard VPN client
group: Applications/Internet
vendor: BoltMesh Team
packager: BoltMesh Team
packagerEmail: support@boltmesh.example
license: ASL 2.0
url: https://github.com/boltmesh-labs/client
requires:
  - gtk3
  # desktop_webview_window links WebKitGTK 4.1 and libsoup 3.
  - webkit2gtk4.1
  - libsoup3
  # flutter_secure_storage_linux links libsecret.
  - libsecret
  # boltmeshd enrollment uses account-management tools and loginctl.
  - shadow-utils
  - systemd
  # wg-quick needs ip for every tunnel and nftables for full-tunnel firewall
  # setup. The generated config always carries DNS; Fedora's systemd-resolved
  # package supplies the resolvconf/resolvectl integration wg-quick invokes.
  - iproute
  - nftables
  - systemd-resolved
  - wireguard-tools
generic_name: VPN Client
keywords:
  - VPN
  - WireGuard
categories:
  - Network
  - Utility
startup_notify: true
# xprop reports the GTK window class as
# "com.boltmesh.boltmesh", "Com.boltmesh.boltmesh". GNOME checks the
# instance component first, so keep it aligned with the application ID.
startup_wm_class: com.boltmesh.boltmesh
# See the deb make_config for the staging contract. On rpm the bundle is
# installed under /usr/share/boltmesh, so boltmeshd is staged there.
postinstall_scripts:
  # Fastforge assembles this list into one script. Capture the status left by
  # its prepended setup, then fail fast so the helper and socket are not
  # reported as installed when setup failed. NetworkManager is optional, so
  # only its configuration reload remains best-effort.
  - |
    postinstall_status=$?
    if [ "$postinstall_status" -ne 0 ]; then
      exit "$postinstall_status"
    fi
    set -e
  # Fastforge 0.6.x emits StartupWMClass for DEB but not RPM. Add the
  # xprop-confirmed class to the generated RPM desktop entry as well.
  - |
    desktop_entry=/usr/share/applications/boltmesh.desktop
    if [ ! -f "$desktop_entry" ]; then
      printf 'boltmesh: desktop entry missing; cannot set StartupWMClass\n' >&2
      exit 1
    fi
    sed -i '/^StartupWMClass=/d' "$desktop_entry"
    # Fastforge's generated desktop file has no trailing newline.
    printf '\n%s\n' 'StartupWMClass=com.boltmesh.boltmesh' >> "$desktop_entry"
  # RPM passes 1 for an initial install and 2 for an upgrade. The helper and
  # its units are installed by this script rather than owned by the RPM, so RPM
  # cannot stop the old process for us. Quiesce both units before overwriting
  # the helper, and refuse the upgrade if a process still owns the old binary.
  # A unit that is not installed has to be tolerated: `systemctl stop` on one
  # returns non-zero, which under `set -e` aborted the whole scriptlet and left
  # the package half-staged on the first upgrade from a build that shipped no
  # units. This mirrors stop_unit() in the uninstall script below.
  - |
    if [ "${1:-1}" -gt 1 ]; then
      stop_unit() {
        unit="$1"
        if ! command -v systemctl >/dev/null 2>&1; then
          return 0
        fi
        load_state="$(systemctl show --property=LoadState --value "$unit")" || return 1
        if [ "$load_state" = "not-found" ]; then
          return 0
        fi
        systemctl stop "$unit" >/dev/null 2>&1 || true
        active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
        main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
        if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
          return 1
        fi
        [ -z "$main_pid" ] || [ "$main_pid" = 0 ] || return 1
      }
      if ! stop_unit boltmeshd.service || ! stop_unit boltmeshd.socket; then
        printf 'boltmesh: failed to stop the privileged helper during upgrade\n' >&2
        exit 1
      fi
    fi
  - install -Dm755 /usr/share/boltmesh/boltmeshd/boltmeshd /usr/libexec/boltmesh/boltmeshd
  - install -Dm644 /usr/share/boltmesh/boltmeshd/boltmeshd.service /usr/lib/systemd/system/boltmeshd.service
  - install -Dm644 /usr/share/boltmesh/boltmeshd/boltmeshd.socket /usr/lib/systemd/system/boltmeshd.socket
  - install -Dm755 /usr/share/boltmesh/boltmeshd/boltmesh-enroll-user /usr/libexec/boltmesh/boltmesh-enroll-user
  - install -Dm644 /usr/share/boltmesh/boltmeshd/99-boltmesh-unmanaged.conf /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
  # wg-quick needs net.ipv4.conf.all.src_valid_mark for a full-tunnel default
  # route, but the helper cannot write it: the unit keeps
  # ProtectKernelTunables, so /proc/sys is read-only in its namespace, and
  # systemd >= 259 rejects a ReadWritePaths= entry inside that hierarchy with
  # status=226/NAMESPACE. Set the tunable host-wide here, at install, where
  # /proc/sys is still writable; wg-quick then skips its own write. A host that
  # already sets it is left alone, and a failure to apply is not fatal to the
  # install because it only affects full-tunnel routing.
  - install -Dm644 /usr/share/boltmesh/boltmeshd/80-boltmesh-src-valid-mark.conf /usr/lib/sysctl.d/80-boltmesh-src-valid-mark.conf
  # procps' `sysctl --load` only reads /etc/sysctl.conf and /etc/sysctl.d, so it
  # exits 0 without ever applying a /usr/lib drop-in. systemd-sysctl searches the
  # full path including /usr/lib/sysctl.d; fall back to writing the one key.
  # Failing to apply is not fatal to the install: it only affects full-tunnel
  # routing, and the admin warning names the key.
  - |
    rc=0
    if command -v systemd-sysctl >/dev/null 2>&1; then
      systemd-sysctl >/dev/null 2>&1 || rc=1
    else
      sysctl -w net.ipv4.conf.all.src_valid_mark=1 >/dev/null 2>&1 || rc=1
    fi
    if [ "$rc" -ne 0 ]; then
      printf 'boltmesh: could not apply net.ipv4.conf.all.src_valid_mark=1; set it by hand for full-tunnel routing\n' >&2
    fi
  # Create the group and enroll the unique active desktop user when the
  # helper validates SUDO_UID/PKEXEC_UID or loginctl identifies one.  If no
  # unambiguous user exists, the command prints an actionable warning and the
  # package remains usable in a headless install; an administrator can run
  # the installed command explicitly.
  - |
    if /usr/libexec/boltmesh/boltmesh-enroll-user --auto; then
      :
    else
      status="$?"
      printf 'boltmesh: desktop-user enrollment failed; run /usr/libexec/boltmesh/boltmesh-enroll-user --uid UID as root\n' >&2
      exit "$status"
    fi
  - systemctl daemon-reload
  - systemctl enable --now boltmeshd.socket
  - nmcli general reload conf >/dev/null 2>&1 || true
postuninstall_scripts:
  # Reload the new unit definitions, then stop and verify the daemon before
  # the socket. Its signal handler and ExecStopPost both call Manager.Down; the
  # explicit --cleanup is a final retry while the service-owned runtime
  # directory (and wg-quick config) still exists. Keep the destructive removals
  # in this set -e block so a failed teardown leaves the helper installed and
  # retryable.
  - |
    # %postun runs on every version removal, and $1 is how many copies of the
    # package remain afterwards: 0 on a final erase, 1 both on a fresh install
    # and when an upgrade retires the old version. Only a final erase may tear
    # down, because on an upgrade the incoming %post has already quiesced the
    # old service and staged the replacement; removing the helper, its units and
    # the NetworkManager drop-in here left an upgraded system with no helper.
    if [ "${1:-0}" -ne 0 ]; then
      exit 0
    fi
    set -e
    if command -v systemctl >/dev/null 2>&1; then
      systemctl daemon-reload >/dev/null 2>&1
      systemctl disable boltmeshd.service boltmeshd.socket >/dev/null 2>&1 || true
    fi
    # A unit reports MainPID=0 once a service is stopped, but a socket unit has
    # no MainPID at all and prints an empty value, so a bare `= 0` test failed
    # for boltmeshd.socket and aborted the scriptlet on every uninstall.
    stop_unit() {
      unit="$1"
      if ! command -v systemctl >/dev/null 2>&1; then
        return 0
      fi
      load_state="$(systemctl show --property=LoadState --value "$unit")" || return 1
      if [ "$load_state" = "not-found" ]; then
        return 0
      fi
      systemctl stop "$unit" >/dev/null 2>&1 || true
      active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
      main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
      if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
        return 1
      fi
      [ -z "$main_pid" ] || [ "$main_pid" = 0 ] || return 1
    }
    stop_unit boltmeshd.service
    stop_unit boltmeshd.socket
    # Only tear the tunnel down when the helper is actually installed. A failed
    # or interrupted %post leaves it absent, and invoking it then exits 127
    # under `set -e`, which skipped every removal below and left the package
    # permanently half-removed. A real teardown failure still aborts here, so
    # the helper is only removed once the tunnel is down.
    if [ -x /usr/libexec/boltmesh/boltmeshd ]; then
      /usr/libexec/boltmesh/boltmeshd --cleanup --config-dir=/run/boltmesh --interface=boltmesh0
    fi
    rm -f /run/boltmesh/boltmeshd.sock /run/boltmesh/boltmesh0.conf
    rmdir /run/boltmesh >/dev/null 2>&1 || true
    rm -f /usr/lib/systemd/system/boltmeshd.service /usr/lib/systemd/system/boltmeshd.socket
    rm -f /usr/libexec/boltmesh/boltmeshd
    rm -f /usr/libexec/boltmesh/boltmesh-enroll-user
    rm -f /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
    rmdir /etc/NetworkManager/conf.d >/dev/null 2>&1 || true
    # The sysctl is host-wide, so removing the drop-in stops BoltMesh from
    # asserting it. Leave the live value alone: another package or the admin
    # may now depend on it, and it is harmless without the helper.
    rm -f /usr/lib/sysctl.d/80-boltmesh-src-valid-mark.conf
    rmdir /usr/libexec/boltmesh >/dev/null 2>&1 || true
    systemctl daemon-reload >/dev/null 2>&1 || true
    nmcli general reload conf >/dev/null 2>&1 || true
