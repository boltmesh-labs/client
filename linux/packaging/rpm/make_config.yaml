display_name: BoltMesh
icon: linux/assets/boltmesh.png
summary: BoltMesh WireGuard VPN client
group: Applications/Internet
vendor: BoltMesh Team
packager: BoltMesh Team
packagerEmail: support@boltmesh.example
license: ASL 2.0
url: https://github.com/boltmesh-labs/client
requires:
  - gtk3
  # desktop_webview_window links WebKitGTK 4.1 and libsoup 3.
  - webkit2gtk4.1
  - libsoup3
  # flutter_secure_storage_linux links libsecret.
  - libsecret
  # boltmeshd enrollment uses account-management tools and loginctl.
  - shadow-utils
  - systemd
  # wg-quick needs ip for every tunnel and nftables for full-tunnel firewall
  # setup. The generated config always carries DNS; Fedora's systemd-resolved
  # package supplies the resolvconf/resolvectl integration wg-quick invokes.
  - iproute
  - nftables
  - systemd-resolved
  - wireguard-tools
generic_name: VPN Client
keywords:
  - VPN
  - WireGuard
categories:
  - Network
  - Utility
startup_notify: true
# See the deb make_config for the staging contract. On rpm the bundle is
# installed under /usr/share/boltmesh, so boltmeshd is staged there.
postinstall_scripts:
  # Fastforge assembles this list into one script. Capture the status left by
  # its prepended setup, then fail fast so the helper and socket are not
  # reported as installed when setup failed. NetworkManager is optional, so
  # only its configuration reload remains best-effort.
  - |
    postinstall_status=$?
    if [ "$postinstall_status" -ne 0 ]; then
      exit "$postinstall_status"
    fi
    set -e
  # RPM passes 1 for an initial install and 2 for an upgrade. The helper and
  # its units are installed by this script rather than owned by the RPM, so RPM
  # cannot stop the old process for us. Quiesce both units before overwriting
  # the helper, and refuse the upgrade if a process still owns the old binary.
  - |
    if [ "${1:-1}" -gt 1 ]; then
      systemctl stop boltmeshd.service boltmeshd.socket
      main_pid="$(systemctl show --property=MainPID --value boltmeshd.service)"
      if [ "$main_pid" != 0 ]; then
        printf 'boltmesh: failed to stop the privileged helper during upgrade\n' >&2
        exit 1
      fi
    fi
  - install -Dm755 /usr/share/boltmesh/boltmeshd/boltmeshd /usr/libexec/boltmesh/boltmeshd
  - install -Dm644 /usr/share/boltmesh/boltmeshd/boltmeshd.service /usr/lib/systemd/system/boltmeshd.service
  - install -Dm644 /usr/share/boltmesh/boltmeshd/boltmeshd.socket /usr/lib/systemd/system/boltmeshd.socket
  - install -Dm755 /usr/share/boltmesh/boltmeshd/boltmesh-enroll-user /usr/libexec/boltmesh/boltmesh-enroll-user
  - install -Dm644 /usr/share/boltmesh/boltmeshd/99-boltmesh-unmanaged.conf /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
  # Create the group and enroll the unique active desktop user when the
  # helper validates SUDO_UID/PKEXEC_UID or loginctl identifies one.  If no
  # unambiguous user exists, the command prints an actionable warning and the
  # package remains usable in a headless install; an administrator can run
  # the installed command explicitly.
  - |
    if /usr/libexec/boltmesh/boltmesh-enroll-user --auto; then
      :
    else
      status="$?"
      printf 'boltmesh: desktop-user enrollment failed; run /usr/libexec/boltmesh/boltmesh-enroll-user --uid UID as root\n' >&2
      exit "$status"
    fi
  - systemctl daemon-reload
  - systemctl enable --now boltmeshd.socket
  - nmcli general reload conf >/dev/null 2>&1 || true
postuninstall_scripts:
  # Reload the new unit definitions, then stop and verify the daemon before
  # the socket. Its signal handler and ExecStopPost both call Manager.Down; the
  # explicit --cleanup is a final retry while the service-owned runtime
  # directory (and wg-quick config) still exists. Keep the destructive removals
  # in this set -e block so a failed teardown leaves the helper installed and
  # retryable.
  - |
    set -e
    if command -v systemctl >/dev/null 2>&1; then
      systemctl daemon-reload >/dev/null 2>&1
      systemctl disable boltmeshd.service boltmeshd.socket >/dev/null 2>&1 || true
    fi
    stop_unit() {
      unit="$1"
      if ! command -v systemctl >/dev/null 2>&1; then
        return 0
      fi
      load_state="$(systemctl show --property=LoadState --value "$unit")" || return 1
      if [ "$load_state" = "not-found" ]; then
        return 0
      fi
      if ! systemctl stop "$unit" >/dev/null 2>&1; then
        active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
        main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
        if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
          return 1
        fi
        [ "$main_pid" = 0 ] || return 1
        return 0
      fi
      active_state="$(systemctl show --property=ActiveState --value "$unit")" || return 1
      main_pid="$(systemctl show --property=MainPID --value "$unit")" || return 1
      if [ "$active_state" != inactive ] && [ "$active_state" != failed ]; then
        return 1
      fi
      [ "$main_pid" = 0 ] || return 1
    }
    stop_unit boltmeshd.service
    stop_unit boltmeshd.socket
    /usr/libexec/boltmesh/boltmeshd --cleanup --config-dir=/run/boltmesh --interface=boltmesh0
    rm -f /run/boltmesh/boltmeshd.sock /run/boltmesh/boltmesh0.conf
    rmdir /run/boltmesh >/dev/null 2>&1 || true
    rm -f /usr/lib/systemd/system/boltmeshd.service /usr/lib/systemd/system/boltmeshd.socket
    rm -f /usr/libexec/boltmesh/boltmeshd
    rm -f /usr/libexec/boltmesh/boltmesh-enroll-user
    rm -f /etc/NetworkManager/conf.d/99-boltmesh-unmanaged.conf
    rmdir /usr/libexec/boltmesh >/dev/null 2>&1 || true
    systemctl daemon-reload >/dev/null 2>&1 || true
    nmcli general reload conf >/dev/null 2>&1 || true
