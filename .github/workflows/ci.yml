name: "Client CI"

# Validation only. The tag-driven release pipeline lives in `release.yml`,
# which reuses this workflow via `workflow_call` so a tagged release is built
# on the same validated commit without duplicating every check.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

# A superseded push must not keep burning the full fan-out (two emulators,
# Windows + Go setups). Cancel-in-progress on PRs and pushes alike; a tagged
# release is driven by `release.yml`, which calls this workflow in its own
# `release` context, where the same group is unique per run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hooks in `.pre-commit-config.yaml` are the repo's documented local gate
  # and are mostly not re-checked in CI. The `validate*` jobs run the Flutter and
  # Go commands independently, and the `security` job runs `gitleaks`; everything
  # else in that file is covered by running the hooks locally, as documented in
  # CONTRIBUTING.md.

  # Dependabot covers four ecosystems here, but nothing checked the actions
  # and build tooling a PR actually pulls in. This catches a newly introduced
  # vulnerable or unexpectedly-licensed dependency before it merges.
  dependency-review:
    name: "Dependency Review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The container, not the `actionlint` pre-commit hook: the hook is
      # `language: golang`, so running it needs a Go toolchain. Pinned to the same
      # v1.7.12 as the hook rev. `GIT_CONFIG_COUNT` marks the workspace safe
      # because the container runs as root while the workspace belongs to the
      # runner user; actionlint walks up looking for the git root and without
      # this it reports "no project was found" and checks nothing.
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        # --enforce-lockfile fails instead of silently rewriting pubspec.lock.
        # This is the only place the lockfile is enforced; the `flutter-lockfile`
        # pre-commit hook is local-only.
        run: flutter pub get --enforce-lockfile

      # Regenerates l10n/build_runner output and fails if it differs from the
      # committed tree: those files are excluded from analyze, so a stale one
      # could otherwise ship green.
      - name: Verify generated code is up to date
        run: bash tool/check_generated.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Format Check
        run: dart format --set-exit-if-changed lib test

      # Same scope as the `shellcheck` pre-commit hook: every shell script, with
      # `-x` so it follows `source`d files. `android/gradlew` is vendored
      # verbatim from the Flutter SDK and its warnings are upstream, so it is
      # skipped; it carries no `.sh` extension, so the glob already leaves it
      # out. `-z`/`-0` keeps a path containing spaces intact, and
      # `--no-run-if-empty` stops xargs invoking shellcheck with no arguments at
      # all, which would read stdin and hang. shellcheck comes from the
      # ubuntu-latest image, so this and the local hook are the same version.
      - name: Shellcheck scripts
        run: git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x

      - name: Run Tests
        run: flutter test --coverage

      - name: Enforce coverage floor
        run: bash tool/coverage_gate.sh 80

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: client-coverage
          path: ${{ github.workspace }}/coverage/lcov.info
          if-no-files-found: error

  validate-windows:
    name: "Validate Windows runner"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      # The Windows half of the validation, in one command: compiles the native
      # runner (helper_pipe.cpp), builds and runs the Flutter-free named-pipe
      # transport test (EXCLUDE_FROM_ALL, so `flutter build` never produces it
      # and it must be built by name), runs the Windows-tagged boltmeshd tests
      # (SCM/DLL-layout seams, which the Linux validate job cannot execute), and
      # asserts the bundle carries the WireGuard files the helper loads from
      # beside itself.
      #
      # This is the same script a developer runs locally
      # (pwsh -File tool/verify_windows.ps1) so the two cannot drift: change the
      # script, not the steps here. It re-runs the pub get above, which is
      # cheap and keeps the script self-contained for local use.
      - name: Verify Windows runner
        shell: pwsh
        run: pwsh -File tool/verify_windows.ps1

  # The minified release build and the lint result are identical on every API
  # level, so they run once here rather than once per emulator leg. The
  # instrumentation run below still compiles through Gradle on each leg.
  android-build:
    name: "Validate Android build"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Set up Go for the Android AWG JNI library
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: android/awg-native/go.sum

      - name: Install the Flutter-pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get

      # vet and lint for the JNI module need cgo with the NDK (this package
      # includes <jni.h> and <android/log.h>), so the APK build's compile is not
      # a gate on its own: it says nothing about vet, lint or formatting.
      # tool/build_awg_android.py owns the toolchain wiring the APK build also
      # uses and runs every ABI, mirroring the linux/Windows/macOS lint steps
      # for boltmeshd. golangci-lint is installed rather than invoked as an
      # action because the check needs that NDK environment for all four ABIs.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Check Android AWG Go module
        run: |
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          make -C android/awg-native check

      # Compile the exact minified variant that is shipped. This catches R8
      # rule/dependency regressions on every PR; the debug fallback means no
      # keystore secret is needed here.
      - name: Build Android APK (minified release)
        run: flutter build apk --release

      # Android Lint needs the SDK path flutter build wrote to
      # android/local.properties, hence after the build. It catches
      # manifest/resource/API misuse the Dart suite cannot see.
      - name: Run Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

  validate-android:
    name: "Validate Android smoke tests (API ${{ matrix.api-level }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Exercise the API 30 connect path and retain the minified bridge
        # coverage on a current API.
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Set up Go for the Android AWG JNI library
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: android/awg-native/go.sum

      - name: Install the Flutter-pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Install dependencies
        run: flutter pub get

      # This job goes straight to ./gradlew instead of `flutter build`, so
      # nothing has written android/local.properties yet. The Flutter Gradle
      # plugin loader reads flutter.sdk from it unguarded (no FLUTTER_ROOT
      # fallback), and setting sdk.dir keeps the SDK path explicit rather than
      # relying on the $ANDROID_HOME fallback.
      - name: Write android/local.properties
        run: |
          : "${FLUTTER_ROOT:?flutter-action did not export FLUTTER_ROOT}"
          : "${ANDROID_HOME:?no Android SDK on PATH}"
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" \
            > android/local.properties

      # GitHub's hosted Android images expose KVM for the emulator step.  The
      # rule is harmless on runners where /dev/kvm is already configured.
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Reflection names and the API 30 Config.parse path are easy to break
      # in a dependency update and are not observable by a debug-only build.
      # Run the instrumentation tests against the minified release APK.
      - name: Run Android release smoke tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          # The action runs each `script` line in its own `sh -c`, so a
          # `cd android` line would be a no-op subshell and `./gradlew`
          # would be resolved at the repo root. Set the step cwd instead.
          working-directory: android
          # A crashed instrumentation run must fail loudly instead of hanging:
          # UTP's am_instrument_timeout is effectively unbounded (one year), so
          # a missing runtime class makes the runner die before reporting and
          # the task waits forever. Bound it so the job fails in minutes.
          script: timeout 1500 ./gradlew :app:connectedReleaseAndroidTest

  validate-native:
    name: "Validate native platform contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      # Cross-builds the Windows-only runner C++ (the Flutter-free named-pipe
      # test) so a Windows-specific break is caught here, not only on the
      # Flutter-gated validate-windows job.
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      # systemd units + staged Linux payload, the Android manifest contract,
      # and the Windows helper channel wiring.
      - name: Verify native platform contracts
        run: bash tool/verify_native.sh

  # The Linux desktop target was only ever compiled by the tag-driven release
  # pipeline, so a broken `linux/CMakeLists.txt`, runner source or native
  # dependency shipped straight to a release tag. `verify_native.sh` only
  # greps the packaging config; the actual compile happens here. Needs the
  # X11/Xi headers the tray plugin links against (see SETUP.md).
  validate-linux:
    name: "Validate Linux desktop build"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxi-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux runner (debug)
        run: flutter build linux --debug

  validate-boltmeshd:
    name: "Validate boltmeshd"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: boltmeshd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      - name: Check Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly according to gofmt:"
            gofmt -l .
            exit 1
          fi

      # `-diff` prints the required change instead of writing it, so this is
      # check-only and cannot leave the tree dirty. The `go-mod-tidy-boltmeshd`
      # pre-commit hook is local-only.
      - name: Check go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: boltmeshd

      # The Windows backend is build-tagged, so lint it separately or it is
      # never analysed on this runner.
      - name: Run golangci-lint (Windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.13.2
          working-directory: boltmeshd

      - name: Cross-compile for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      # The macOS backend is build-tagged like the Windows one, so it needs the
      # same treatment or it is never analysed. `go vet` type-checks the
      # darwin-tagged tests too; they cannot be *run* here (they need a utun
      # interface and root), which is what the macOS runner is for.
      - name: Run golangci-lint (macOS)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin
          GOARCH: arm64
        with:
          version: v2.13.2
          working-directory: boltmeshd

      - name: Cross-compile for macOS
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./...

      # Host-platform only, deliberately. deadcode resolves build tags for the
      # GOOS it runs under, so on Linux the macOS (and Windows) backends are
      # invisible. The `go vet` steps above already type-check both tagged
      # backends; this check exists to catch genuinely dead code in what the
      # host actually builds.
      #
      # -test is required, not cosmetic. internal/tunnel/uapi.go carries no
      # build tag by design — the wg-quick <-> UAPI translation is the
      # unit-testable part of the macOS backend and its tests run on every
      # runner — yet its only production callers live in the darwin-tagged
      # tunnel_darwin.go. Without the test packages as entry points the whole
      # file reads as unreachable here, even though it is compiled and covered
      # by uapi_test.go. This mirrors golangci-lint's `unused`, which also
      # counts test usage, which is why the lint steps above report nothing
      # where this step did. The trade is that a helper used only by tests is
      # no longer reported as dead.
      - name: Check for unreachable functions (deadcode)
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 -test ./...)"
          if [ -n "$out" ]; then
            echo "Unreachable functions detected:"
            echo "$out"
            exit 1
          fi

      - name: Run Go Unit Tests
        run: go test -v ./...

      # `boltmesh/stream` is a separate module (so the Android native build can
      # import it), and the steps above all target `boltmeshd`. A change there
      # fires the boltmeshd suite through the wire-format tests, but the module
      # itself still needs formatting, tidiness, lint and its own tests checked
      # here or it can rot between the two consumers.
      - name: Check stream formatting (gofmt)
        working-directory: stream
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly according to gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Check stream go.mod/go.sum are tidy
        working-directory: stream
        run: go mod tidy -diff

      - name: Run golangci-lint (stream)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: stream

      - name: Run stream Go unit tests
        working-directory: stream
        run: go test -v ./...

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans commits rather than the working tree, so
          # a secret committed earlier and deleted later is still caught. The
          # local hook structurally cannot see that case, because it only ever
          # looks at staged files. `version` matches the pinned hook rev. Runs
          # before Trivy so a leak fails the job without also paying for the
          # filesystem scan.
          fetch-depth: 0
          persist-credentials: false

      # The OSS container, not `gitleaks/gitleaks-action`: v3 requires a paid
      # GITLEAKS_LICENSE for organisation-owned repos, and v2 runs on Node 20,
      # which GitHub removed from hosted runners on 2026-09-16. The container is
      # the same v8.30.1 binary the local hook pins, so the two agree.
      #
      # `git` scans commit history, which is the point -- a secret committed and
      # later deleted is still caught, and the local hook cannot see that case
      # because it runs `--staged`. This repo's history is already clean, so it
      # needs no `.gitleaksignore`.
      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repo as "dubious ownership" and scans nothing
      # -- it still exits 0, so this fails silently. Mark the workspace safe via
      # the environment rather than a config file, so it lands inside the
      # container: `GIT_CONFIG_COUNT` is read by git itself and needs no
      # writable HOME.
      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --redact --no-banner --verbose --exit-code 1 .

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"
