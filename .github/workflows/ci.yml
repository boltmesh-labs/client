name: "Client CI"

# Security and dependency review only. The per-commit validation gate
# (generated code, analyze, format, Dart tests and coverage, Go lint/tests, the
# native contract checks, and the Windows/Android builds) lives in
# CONTRIBUTING.md and AGENTS.md and is run manually. It is deliberately not
# repeated here: the toolchains those checks need (Flutter SDK, Go build cache,
# Gradle, the Android NDK) populated gigabytes of Actions caches, and the
# account's shared storage allowance could not sustain them.
#
# Three trigger contexts:
#   * a pull request runs `dependency-review` and `security`;
#   * a push to `main` runs `security`. `main` is unprotected and most commits
#     here arrive by direct push rather than by PR, so without this a push lands
#     with no check at all;
#   * the tag gate (`workflow_call` from `release.yml`) runs `security` again on
#     the tagged commit, which is what still gates a release.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

# A superseded commit must not keep burning runner time. Cancel-in-progress on
# PRs and pushes alike. The `ci-` prefix is required: a reusable call (the
# `validate` job in `release.yml`) reports the *caller's* `github.workflow` and
# `github.ref`, so without a namespace the nested run joins the parent's
# concurrency group and GitHub cancels the release as a deadlock before any job
# starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dependabot covers four ecosystems here, but nothing checked the actions
  # and build tooling a PR actually pulls in. This catches a newly introduced
  # vulnerable or unexpectedly-licensed dependency before it merges.
  dependency-review:
    name: "Dependency Review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans commits rather than the working tree, so
          # a secret committed earlier and deleted later is still caught. The
          # local hook structurally cannot see that case, because it only ever
          # looks at staged files. `version` matches the pinned hook rev. Runs
          # before Trivy so a leak fails the job without also paying for the
          # filesystem scan.
          fetch-depth: 0
          persist-credentials: false

      # The OSS container, not `gitleaks/gitleaks-action`: v3 requires a paid
      # GITLEAKS_LICENSE for organisation-owned repos, and v2 runs on Node 20,
      # which GitHub removed from hosted runners on 2026-09-16. The container is
      # the same v8.30.1 binary the local hook pins, so the two agree.
      #
      # `git` scans commit history, which is the point -- a secret committed and
      # later deleted is still caught, and the local hook cannot see that case
      # because it runs `--staged`. This repo's history is already clean, so it
      # needs no `.gitleaksignore`.
      # The container runs as root while the workspace is owned by the runner
      # user, so git refuses the repo as "dubious ownership" and scans nothing
      # -- it still exits 0, so this fails silently. Mark the workspace safe via
      # the environment rather than a config file, so it lands inside the
      # container: `GIT_CONFIG_COUNT` is read by git itself and needs no
      # writable HOME.
      - name: Scan for committed secrets
        uses: docker://zricethezav/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        with:
          args: git --redact --no-banner --verbose --exit-code 1 .

      # Trivy's built-in DB caching (on by default) keys the vulnerability DB by
      # date, so every day of CI left behind another ~90 MB entry that nothing
      # evicts -- and a PR whose key differs gets its own copy, since caches are
      # scoped per ref. Those entries filled the account's shared Actions
      # storage allowance, which blocks artifact uploads account-wide. Re-pull
      # the DB per run instead.
      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"
          cache: "false"
