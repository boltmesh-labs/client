name: "Client CI/CD"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

# Least privilege by default: every job only reads the repository. Jobs that
# need more (the release job writes contents and mints OIDC tokens for keyless
# signing/attestation) grant it themselves, so a compromised third-party action
# cannot mint OIDC tokens or touch the security tab from the validate/scan jobs.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Regenerates l10n/build_runner output and fails if it differs from the
      # committed tree: those files are excluded from analyze, so a stale one
      # could otherwise ship green.
      - name: Verify generated code is up to date
        run: bash tool/check_generated.sh

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Format Check
        run: dart format --set-exit-if-changed lib test

      - name: Run Tests
        run: flutter test --coverage

      - name: Enforce coverage floor
        run: bash tool/coverage_gate.sh 80

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: client-coverage
          path: ${{ github.workspace }}/coverage/lcov.info
          if-no-files-found: error

  validate-windows:
    name: "Validate Windows runner"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # Compiles the native runner (helper_pipe.cpp) so a Windows-only C++
      # break is caught even though the platform ships no installer yet.
      - name: Build Windows runner (debug)
        run: flutter build windows --debug

      # Compiles and runs the Flutter-free named-pipe transport test. Runs the
      # freshly built exe from wherever the generator placed it.
      - name: Run Windows helper pipe tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter helper_pipe_io_tests.exe |
            Select-Object -First 1
          if ($null -eq $exe) { throw 'helper_pipe_io_tests.exe was not built' }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "helper_pipe_io_tests.exe failed (exit $LASTEXITCODE)"
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      # Runs the Windows-tagged boltmeshd tests (SCM/DLL-layout seams), which
      # cannot run on the Linux validate job.
      - name: Test boltmeshd (Windows)
        working-directory: boltmeshd
        run: go test ./... -count=1

  validate-android:
    name: "Validate Android build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Configures and compiles the Android app so a broken Gradle edit (e.g.
      # the release signing config) fails on the PR instead of a release tag.
      # Uses the debug fallback, so no keystore secret is needed here.
      - name: Build Android APK (debug)
        run: flutter build apk --debug

      # Android Lint needs the SDK path flutter build wrote to
      # android/local.properties, hence after the build. It catches
      # manifest/resource/API misuse the Dart suite cannot see.
      - name: Run Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

  validate-native:
    name: "Validate native platform contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      # systemd units + staged Linux payload, the Android manifest contract,
      # and the Windows helper channel wiring.
      - name: Verify native platform contracts
        run: bash tool/verify_native.sh

  validate-boltmeshd:
    name: "Validate boltmeshd"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: boltmeshd
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      - name: Check Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly according to gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: boltmeshd

      # The Windows backend is build-tagged, so lint it separately or it is
      # never analysed on this runner.
      - name: Run golangci-lint (Windows)
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.13.2
          working-directory: boltmeshd

      - name: Cross-compile for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      - name: Check for unreachable functions (deadcode)
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.50.0 ./...)"
          if [ -n "$out" ]; then
            echo "Unreachable functions detected:"
            echo "$out"
            exit 1
          fi

      - name: Run Go Unit Tests
        run: go test -v ./...

  security:
    name: "Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          format: "table"
          ignore-unfixed: true
          severity: "CRITICAL"
          exit-code: "1"

  build-android:
    name: "Build Android"
    needs: [validate, validate-android, validate-native, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The git tag is the release source of truth; pubspec's checked-in
      # version is dev-only. Android versionName and the fastforge artifact
      # names both derive from pubspec.
      - name: Sync version from tag
        run: dart run tool/set_release_version.dart

      # Decodes the base64 keystore and writes android/key.properties so the
      # release build is signed with the upload key, never the debug key.
      # Required on tags: a debug-signed artifact is not distributable.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE is not set; refusing to publish a debug-signed release. See README.md (Android release build)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
          echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-android
          path: |
            ${{ github.workspace }}/build/app/outputs/bundle/release/app-release.aab
            ${{ github.workspace }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-linux:
    name: "Build Linux"
    needs: [validate, validate-boltmeshd, validate-native, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libsecret-1-dev file rpm patchelf

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # The git tag is the release source of truth; pubspec's checked-in
      # version is dev-only. fastforge derives the package version/names from
      # pubspec.
      - name: Sync version from tag
        run: dart run tool/set_release_version.dart

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Package Linux installers (deb, rpm)
        run: fastforge release --name=production

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            ${{ github.workspace }}/dist/**/*.deb
            ${{ github.workspace }}/dist/**/*.rpm
          if-no-files-found: error

  build-windows:
    name: "Build Windows"
    needs: [validate, validate-windows, validate-native, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # The git tag is the release source of truth; pubspec's checked-in
      # version is dev-only. fastforge derives the installer version/names
      # from pubspec.
      - name: Sync version from tag
        run: dart run tool/set_release_version.dart

      # The helper is built by windows/packaging/stage_boltmeshd.ps1 just
      # before packing, into the app bundle so Inno ships it next to
      # boltmesh.exe.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: boltmeshd/go.sum

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install fastforge
        run: |
          dart pub global activate fastforge
          echo "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Decodes the base64 .pfx (repo secrets) to a temp file and exports its
      # path/password so the fastforge signing hooks inherit them. Required on
      # tags (this job only runs on tags): an unsigned installer is not
      # distributable, matching build-android's keystore gate.
      - name: Prepare signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'boltmesh-codesign.pfx'
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE)) {
            Write-Host '::error::WINDOWS_CERTIFICATE is not set; refusing to publish an unsigned release. See README.md (Windows code signing).'
            exit 1
          }
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Runs only the windows-exe job; the Linux jobs are skipped on Windows
      # (and vice versa on the Linux runner) by fastforge. The job's hooks sign
      # the app exe and the installer.
      - name: Package Windows installer
        run: fastforge release --name=production

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'boltmesh-codesign.pfx') -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ github.workspace }}/dist/**/*.exe
          if-no-files-found: error

  release:
    name: "Create Release"
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Write the drafted release and its assets; read this run's artifacts.
      contents: write
      actions: read
      # Mint the OIDC identity that keyless cosign and the Sigstore attestations
      # sign with, and persist the attestations under the repository.
      id-token: write
      attestations: write

    steps:
      # The release job SBOMs the tag's source (Dart pubspec.lock, Go modules),
      # so it needs the repository, not just the downloaded build outputs.
      - uses: actions/checkout@v7

      - name: Download Android Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release-android
          path: artifacts/android

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: artifacts/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      # Source SBOM: catalogues Dart (pubspec.lock), Go (boltmeshd/go.mod) and
      # any other lockfiles at the tag. Excludes the downloaded binaries, which
      # the package SBOM below covers.
      - name: Generate source SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p artifacts/sbom
          "$SYFT" scan dir:. \
            --exclude './.git/**' --exclude './artifacts/**' \
            -o cyclonedx-json="artifacts/sbom/boltmesh-${{ github.ref_name }}.cdx.json" \
            -o spdx-json="artifacts/sbom/boltmesh-${{ github.ref_name }}.spdx.json"

      # Package SBOM: Syft catalogs the .deb/.rpm contents (and any embedded Go
      # binaries) so consumers can map the shipped packages back to versions.
      - name: Generate package SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" scan dir:artifacts \
            --exclude './sbom/**' --exclude '**/sbom/**' \
            -o cyclonedx-json="artifacts/sbom/boltmesh-${{ github.ref_name }}-packages.cdx.json" \
            -o spdx-json="artifacts/sbom/boltmesh-${{ github.ref_name }}-packages.spdx.json"

      # SHA-256 of every published installer, keyed by the asset basename so
      # the manifest matches the release's file names.
      - name: Generate checksum manifest
        run: |
          cd artifacts
          find . -type f \( -name '*.aab' -o -name '*.apk' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' \) -exec sha256sum {} + \
            | while read -r hash path; do printf '%s  %s\n' "$hash" "$(basename "$path")"; done \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      # Keyless signing: the signature carries this workflow's OIDC identity and
      # is recorded in the public Rekor transparency log, so no long-lived key
      # is stored in the repository. Detached bundles land next to each package
      # and are published with it.
      - name: Sign Linux packages and checksum manifest
        run: |
          while IFS= read -r -d '' pkg; do
            cosign sign-blob --yes --bundle "${pkg}.sigstore.json" "$pkg"
          done < <(find artifacts/linux -type f \( -name '*.deb' -o -name '*.rpm' \) -print0)
          cosign sign-blob --yes --bundle artifacts/SHA256SUMS.sigstore.json artifacts/SHA256SUMS

      # Publishes signed SLSA build provenance for every distributable to the
      # repository's attestation API (verifiable with `gh attestation verify`).
      - name: Attest build provenance
        id: attest-provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/android/**/*.aab
            artifacts/android/**/*.apk
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/windows/**/*.exe

      # Binds the source SBOM to the same subjects. `actions/attest-sbom` is
      # deprecated in favour of `actions/attest` with `sbom-path`.
      - name: Attest source SBOM
        id: attest-sbom
        uses: actions/attest@v4
        with:
          sbom-path: artifacts/sbom/boltmesh-${{ github.ref_name }}.cdx.json
          subject-path: |
            artifacts/android/**/*.aab
            artifacts/android/**/*.apk
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/windows/**/*.exe
          # Nothing is pushed to a registry, so no storage record is created and
          # the artifact-metadata permission is not needed.
          create-storage-record: false

      # The attestation API is the source of truth; also publish the raw Sigstore
      # bundles so a release can be verified offline.
      - name: Collect attestation bundles
        run: |
          mkdir -p artifacts/attestations
          cp "${{ steps.attest-provenance.outputs.bundle-path }}" \
            "artifacts/attestations/boltmesh-${{ github.ref_name }}-provenance.sigstore.json"
          cp "${{ steps.attest-sbom.outputs.bundle-path }}" \
            "artifacts/attestations/boltmesh-${{ github.ref_name }}-sbom.sigstore.json"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/android/**/*.aab
            artifacts/android/**/*.apk
            artifacts/linux/**/*
            artifacts/windows/**/*.exe
            artifacts/sbom/**/*
            artifacts/attestations/**/*
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sigstore.json
          draft: true
          prerelease: false
          generate_release_notes: true
