name: 'Backend CI/CD'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

defaults:
  run:
    working-directory: backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint and Format Check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with Pyright
        run: uv run pyright

      - name: Lint Architecture & Imports
        run: uv run lint-imports

      - name: Lint Provisioning Scripts with ShellCheck
        run: |
          docker run --rm -v "$PWD/scripts:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0 -x provision-node.sh provision-lib.sh

      - name: Run Pytest
        run: uv run pytest

  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Trivy Filesystem Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL'
          exit-code: '1'

