# Automated dependency updates (Dependabot).
#
# One entry per ecosystem the repository builds: Flutter/Dart (`pub`),
# Android (Gradle, including the wrapper and AGP), the privileged Go helper
# (`gomod`) and the workflows' own actions (`github-actions`). Minor and patch
# bumps within an ecosystem are grouped into a single PR; majors stay
# ungrouped so a breaking bump (and any resulting generated-code drift) is
# reviewable on its own.
#
# Every Dependabot PR opens against `main`/`develop` and therefore runs the
# `validate*` and `security` jobs in `.github/workflows/ci.yml`, which
# need no secrets. Dependabot's own security updates bypass the `schedule`
# and `groups` below and open immediately.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "dart"
    groups:
      flutter-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "android"
    groups:
      android-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/boltmeshd"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
