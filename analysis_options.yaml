analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated code: regenerated by build_runner (`models`, `*.freezed`,
    # `*.g`) and `flutter gen-l10n`. Linting it adds nothing and would fail
    # the build on upstream's formatting, so it is analyzed only in the
    # generator, never here.
    - lib/l10n/gen/**
    - "**/*.freezed.dart"
    - "**/*.g.dart"
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - unawaited_futures
    - discarded_futures
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - prefer_relative_imports
    - avoid_relative_lib_imports
    - directives_ordering
    - avoid_void_async
    - avoid_redundant_argument_values
    - cancel_subscriptions
    - prefer_single_quotes
    - prefer_final_fields
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_unused_constructor_parameters
    - no_leading_underscores_for_local_identifiers
    - prefer_const_constructors_in_immutables
    - prefer_const_literals_to_create_immutables
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - close_sinks
