# Inno Setup installer for `fastforge package --platform windows --target exe`
# (run through `client/distribute_options.yaml`).
#
# Why an Inno `.exe` and not MSIX: the privileged `boltmeshd` helper is
# installed as a Windows service, which MSIX cannot do. The app exe itself no
# longer requests elevation — the helper owns the WireGuard tunnel service —
# but the installer still runs elevated to install that helper.
#
# `script_template` selects windows/packaging/exe/boltmesh.iss, which adds the
# helper service install/uninstall entries to the default template.

# Stable product GUID; never change it or upgrades install side by side.
app_id: A79C3DB7-DE52-4F6C-B2BF-8EF6767852F9
# `flutter_app_packager` 0.6.x reads `publisher_name`; the docs use
# `publisher`. Set both so the installer's publisher is never blank.
publisher_name: BoltMesh
publisher: BoltMesh
publisher_url: https://boltmesh.mooo.com
display_name: BoltMesh
create_desktop_icon: true
install_dir_name: "{autopf64}\\BoltMesh"
setup_icon_file: windows\runner\resources\app_icon.ico
# The installer needs elevation to write Program Files and install the
# boltmeshd service; the app it launches runs unprivileged.
privileges_required: admin
script_template: boltmesh.iss
locales:
  - en
