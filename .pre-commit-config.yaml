repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: "^assets/"
      - id: check-merge-conflict

  - repo: local
    hooks:
      # --- Shellcheck ---
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]

      # --- Go Fmt (boltmeshd) ---
      - id: go-fmt-boltmeshd
        name: go fmt (boltmeshd)
        entry: make -C boltmeshd format
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Golangci Lint (boltmeshd) ---
      - id: golangci-lint-boltmeshd
        name: golangci-lint (boltmeshd)
        entry: make -C boltmeshd lint
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Generated code (l10n + build_runner) ---
      - id: check-generated
        name: check generated code
        entry: bash tool/check_generated.sh
        language: system
        pass_filenames: false
        files: ^(lib/.*\.dart$|l10n\.yaml$|.*\.arb$|pubspec\.(yaml|lock)$|tool/check_generated\.sh$)

      # --- Dart Format ---
      - id: dart-format
        name: dart format
        entry: dart format .
        language: system
        types: [dart]

      # --- Flutter Analyze ---
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        pass_filenames: false

      # --- Prettier ---
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [css, javascript, jsx, ts, tsx, json, yaml, html]

      # --- Markdown Lint ---
      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint-cli --fix
        language: system
        types: [markdown]
