repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: "^assets/"
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --- Shellcheck ---
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]

      # --- Go Fmt (boltmeshd) ---
      - id: go-fmt-boltmeshd
        name: go fmt (boltmeshd)
        entry: make -C boltmeshd format
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Golangci Lint (boltmeshd) ---
      - id: golangci-lint-boltmeshd
        name: golangci-lint (boltmeshd)
        entry: make -C boltmeshd lint
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      - id: golangci-lint-boltmeshd-windows
        name: golangci-lint (boltmeshd, Windows)
        entry: make -C boltmeshd lint-windows
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Go Tests / Module Metadata (boltmeshd) ---
      - id: go-test-boltmeshd
        name: go test (boltmeshd)
        entry: make -C boltmeshd test
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      - id: go-mod-tidy-boltmeshd
        name: go mod tidy check (boltmeshd)
        entry: make -C boltmeshd mod-tidy-check
        language: system
        files: ^boltmeshd/
        pass_filenames: false

      # --- Generated code (l10n + build_runner) ---
      - id: check-generated
        name: check generated code
        entry: bash tool/check_generated.sh
        language: system
        pass_filenames: false
        files: ^(lib/.*\.dart$|l10n\.yaml$|.*\.arb$|pubspec\.(yaml|lock)$|tool/check_generated\.sh$)

      # --- Flutter dependency metadata ---
      - id: flutter-lockfile
        name: Flutter lockfile check
        entry: flutter pub get --enforce-lockfile
        language: system
        files: ^pubspec\.(yaml|lock)$
        pass_filenames: false

      # --- Dart Format ---
      - id: dart-format
        name: dart format
        entry: dart format .
        language: system
        types: [dart]

      # --- Flutter Analyze ---
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        pass_filenames: false

      # --- Prettier ---
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [css, javascript, jsx, ts, tsx, json, yaml, html]

      # --- Markdown Lint ---
      - id: markdownlint
        name: markdownlint
        entry: npx markdownlint-cli --fix
        language: system
        types: [markdown]
