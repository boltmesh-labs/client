repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: "^assets/"
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # --- Shellcheck ---
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        types: [shell]
        # Gradle's wrapper is vendored verbatim from the Flutter SDK's
        # gradle_wrapper artifact; its warnings are upstream, not ours.
        exclude: ^android/gradlew$

      # --- Go Fmt (boltmeshd) ---
      - id: go-fmt-boltmeshd
        name: go fmt (boltmeshd)
        entry: make -C boltmeshd format
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Golangci Lint (boltmeshd) ---
      - id: golangci-lint-boltmeshd
        name: golangci-lint (boltmeshd)
        entry: make -C boltmeshd lint
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      - id: golangci-lint-boltmeshd-windows
        name: golangci-lint (boltmeshd, Windows)
        entry: make -C boltmeshd lint-windows
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # The macOS backend lives entirely behind `//go:build darwin`, so neither
      # the Linux nor the Windows lint ever sees it. Without this hook it
      # would rot silently until someone built on a Mac.
      - id: golangci-lint-boltmeshd-darwin
        name: golangci-lint (boltmeshd, macOS)
        entry: make -C boltmeshd lint-darwin
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # Type-checks the darwin-only files and their tests. The tagged tests
      # themselves need a macOS host (utun + root) and run only there.
      - id: go-vet-boltmeshd-darwin
        name: go vet (boltmeshd, macOS)
        entry: make -C boltmeshd test-darwin
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      # --- Go Tests / Module Metadata (boltmeshd) ---
      - id: go-test-boltmeshd
        name: go test (boltmeshd)
        entry: make -C boltmeshd test
        language: system
        types: [go]
        files: ^boltmeshd/
        pass_filenames: false

      - id: go-mod-tidy-boltmeshd
        name: go mod tidy check (boltmeshd)
        entry: make -C boltmeshd mod-tidy-check
        language: system
        files: ^boltmeshd/
        pass_filenames: false

      # --- Generated code (l10n + build_runner) ---
      - id: check-generated
        name: check generated code
        entry: bash tool/check_generated.sh
        language: system
        pass_filenames: false
        files: ^(lib/.*\.dart$|l10n\.yaml$|.*\.arb$|pubspec\.(yaml|lock)$|tool/check_generated\.sh$)

      # --- Flutter dependency metadata ---
      - id: flutter-lockfile
        name: Flutter lockfile check
        entry: flutter pub get --enforce-lockfile
        language: system
        files: ^pubspec\.(yaml|lock)$
        pass_filenames: false

      # --- Dart Format ---
      # `lib`/`test` is the scope the `validate` job gates
      # (`dart format --set-exit-if-changed lib test`), so the hook formats
      # exactly that and stays skipped for a `.dart` change outside it. The
      # formatter exits 0 even when it rewrites files; pre-commit fails the
      # commit because the hook modified them, which is what makes this a gate.
      - id: dart-format
        name: dart format
        entry: dart format lib test
        language: system
        files: ^(lib|test)/.*\.dart$
        pass_filenames: false

      # --- Flutter Analyze ---
      # `--fatal-infos` is the form the `validate` job runs and AGENTS.md
      # documents: without it an info-level diagnostic passes here and fails
      # there.
      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze --fatal-infos
        language: system
        pass_filenames: false

      # --- Prettier ---
      - id: prettier
        name: prettier
        # Pinned, and the version is the point: these hooks run in CI with
        # `--all-files`, so a resolved-version change reformats every covered
        # file at once and fails a PR that touched none of them -- including
        # `.github/workflows/*.yml`, meaning a prettier default change could
        # break the workflow that defines CI. Bump by hand (Dependabot has no
        # `npm` ecosystem here and does not read versions out of this file) and
        # land the resulting reformat in its own commit.
        #
        # `language: node` with the pin in `additional_dependencies`, for the
        # same reason as markdownlint below: pre-commit installs the version
        # once into `~/.cache/pre-commit`, which the `pre-commit` CI job caches,
        # instead of `npx --yes` fetching it into an uncached `~/.npm/_npx` on
        # every run.
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        types_or: [css, javascript, jsx, ts, tsx, json, yaml, html]
        # Xcode owns the asset-catalog Contents.json files, so keep their
        # Xcode-generated layout out of prettier's way.
        exclude: ^(ios|macos)/Runner/Assets\.xcassets/

      # --- Markdown Lint ---
      - id: markdownlint
        name: markdownlint
        # Pinned for the same reason as prettier above. markdownlint-cli2 is the
        # maintained CLI, it bundles the engine so this pins both, and it pins
        # its whole top-level tree exactly where markdownlint-cli floated it in
        # `~` ranges. It resolves the same markdownlint 0.41.1, so the rules and
        # .markdownlint.json are untouched and nothing reformats. It took over
        # from markdownlint-cli after a 2026-09-26 micromark release broke that
        # entry's install with a missing ESM export.
        #
        # `language: node` with the pin in `additional_dependencies`, not an
        # `npx` entry. The version is still pinned to 0.23.3 and still resolves
        # the same tree, so the rules and .markdownlint.json are unchanged. The
        # difference is where that tree lives: `npx --yes` re-resolved and
        # re-downloaded all ~80 packages into `~/.npm/_npx` on every run, on
        # every machine, including CI, where nothing caches that directory. A
        # truncated extraction there (observed as a half-written
        # `katex/dist/katex.mjs`, which markdownlint pulls in via
        # micromark-extension-math) killed the hook with a bare ESM SyntaxError
        # before it read a file, and re-running reproduced it. pre-commit
        # installs this tree once into `~/.cache/pre-commit`, which the
        # `pre-commit` CI job already caches and restores, so the download
        # happens on a cache miss rather than on every run.
        entry: markdownlint-cli2 --fix
        language: node
        additional_dependencies: ["markdownlint-cli2@0.23.3"]
        types: [markdown]
