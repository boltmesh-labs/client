# wg-quick enables policy routing for a full-tunnel AllowedIPs list, and
# `wg-quick up` only writes net.ipv4.conf.all.src_valid_mark when it is not
# already 1 (see the guard in wg-quick's set_mark). Setting it here means the
# helper never needs to write it at runtime.
#
# The helper cannot make that write itself: the unit keeps
# ProtectKernelTunables=yes, so /proc/sys is read-only inside its namespace,
# and from systemd 259 a ReadWritePaths= entry inside that hierarchy is
# rejected outright with status=226/NAMESPACE. Setting the tunable host-wide
# here keeps the hardening boundary intact and still lets full-tunnel come up.
#
# Only the reverse-path-filter mark is enabled; every other kernel tunable
# stays read-only to the helper.
net.ipv4.conf.all.src_valid_mark = 1
