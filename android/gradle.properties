org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Reuse task outputs across builds instead of redoing them from scratch.
# Gradle's own default is off, and `actions/setup-java`'s `cache: gradle`
# persists ~/.gradle/caches (which is where build-cache-1 lives), so enabling
# this survives between CI runs: it pays off in release.yml, where the appbundle
# and the APK are assembled one after the other from the same sources, and for a
# dependency-only bump whose Dart and resource inputs are unchanged.
org.gradle.caching=true
